<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collection — Musalli Secrets</title>
  <link rel="stylesheet" href="/style.css" />
  <script type="module" src="/src/components/site-navbar.js"></script>
  <script type="module" src="/src/components/site-footer.js"></script>
  <script type="module" src="/src/components/catalog-grid.js"></script>
  <script type="module" src="/src/catalog-page.js"></script>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh;background:#0A0A0A;color:#F0EDE8">

  <site-navbar active="catalog"></site-navbar>

  <main style="flex:1;padding:4rem 2rem;max-width:80rem;margin:0 auto;width:100%">
    <div style="margin-bottom:3rem">
      <span id="cat-eyebrow" style="font-size:0.7rem;letter-spacing:0.5em;color:#C5A059;text-transform:uppercase;display:block;margin-bottom:0.75rem">The Collection</span>
      <h1 id="cat-heading" style="font-size:1.875rem;font-weight:300;color:#F5F5F5;letter-spacing:0.1em;text-transform:uppercase">Choose Your Set</h1>
      <p id="cat-subheading" style="color:#555;font-size:0.875rem;margin-top:0.5rem;max-width:32rem;line-height:1.6">
        Each set is configured as one — a shared metal, gemstone, and carat weight applied across every piece. Price updates in real time in SAR.
      </p>
    </div>
    <catalog-grid api="/api/sets"></catalog-grid>
  </main>

  <site-footer></site-footer>

</body>
</html>
