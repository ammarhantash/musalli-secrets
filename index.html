<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musalli Secrets — Fine Jewelry</title>
  <link rel="stylesheet" href="/style.css" />
  <script type="module" src="/src/components/site-navbar.js"></script>
  <script type="module" src="/src/components/site-footer.js"></script>
  <script type="module" src="/src/components/waitlist-form.js"></script>
  <script type="module" src="/src/home-page.js"></script>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh;background:#0A0A0A;color:#F0EDE8">

  <site-navbar active="home"></site-navbar>

  <!-- Hero -->
  <section style="position:relative;overflow:hidden">
    <div style="max-width:64rem;margin:0 auto;padding:6rem 2rem 5rem;text-align:center">
      <p id="home-eyebrow" style="font-size:0.7rem;letter-spacing:0.5em;color:#C5A059;text-transform:uppercase;margin-bottom:1.5rem"></p>
      <h1 id="home-title" style="font-family:'Playfair Display',serif;font-size:clamp(2.5rem,7vw,5rem);
          font-weight:400;letter-spacing:0.05em;color:#F0EDE8;line-height:1.15;margin-bottom:1.75rem"></h1>
      <p id="home-body" style="font-size:1.05rem;color:#B0ABA3;max-width:28rem;margin:0 auto 2.5rem;line-height:1.7;font-weight:400"></p>
      <a id="home-cta" href="/catalog.html"
        style="display:inline-block;padding:1rem 2.75rem;background:#C5A059;color:#0A0A0A;
               font-size:0.75rem;letter-spacing:0.25em;text-transform:uppercase;font-weight:500;
               text-decoration:none;transition:background 0.2s"
        onmouseover="this.style.background='#A68A4D'" onmouseout="this.style.background='#C5A059'">
      </a>
    </div>
  </section>

  <!-- Pillars -->
  <section style="border-top:1px solid #151515;border-bottom:1px solid #151515;background:#0D0D0D">
    <div id="home-pillars" style="max-width:72rem;margin:0 auto;display:grid;
         grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:3rem;
         padding:3.5rem 2rem;text-align:center"></div>
  </section>

  <!-- Drop teaser -->
  <section style="max-width:42rem;margin:0 auto;padding:5rem 2rem;text-align:center">
    <h2 id="home-dropTitle" style="font-family:'Playfair Display',serif;font-size:2rem;
        font-weight:400;color:#F0EDE8;margin-bottom:1.25rem"></h2>
    <p id="home-dropBody" style="color:#9A9A9A;line-height:1.7;margin-bottom:2rem"></p>
    <a id="home-dropCta" href="/catalog.html"
      style="font-size:0.75rem;letter-spacing:0.2em;text-transform:uppercase;
             color:#C5A059;text-decoration:none;border-bottom:1px solid #C5A059;
             padding-bottom:2px;transition:color 0.2s"
      onmouseover="this.style.color='#A68A4D'" onmouseout="this.style.color='#C5A059'">
    </a>
  </section>

  <!-- Heritage strip -->
  <section style="border-top:1px solid #151515;border-bottom:1px solid #151515;background:#080808">
    <p id="home-heritage" style="max-width:60rem;margin:0 auto;padding:2rem 2rem;
       text-align:center;font-family:'Playfair Display',serif;font-size:0.95rem;
       font-style:italic;color:#8A857D;letter-spacing:0.03em;line-height:1.7"></p>
  </section>

  <!-- Waitlist -->
  <section id="waitlist" style="max-width:32rem;margin:0 auto;padding:5rem 2rem">
    <h2 id="home-wlTitle" style="font-family:'Playfair Display',serif;font-size:1.75rem;
        font-weight:400;color:#F0EDE8;text-align:center;margin-bottom:0.75rem"></h2>
    <p id="home-wlBody" style="color:#9A9A9A;text-align:center;margin-bottom:2rem;font-size:0.875rem;line-height:1.6"></p>
    <waitlist-form></waitlist-form>
  </section>

  <div style="flex:1"></div>
  <site-footer></site-footer>

</body>
</html>
